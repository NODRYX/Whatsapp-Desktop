name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist, default v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) { $tag = "v1.0.0" }
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved tag: $tag"
          git fetch --tags --force
          git show-ref --tags | Out-Host
          git log --oneline -5 | Out-Host

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Install rsrc
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          "$env:USERPROFILE/go/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          rsrc -help 2>&1 | Select-Object -First 3 | Out-Host

      - name: Regenerate rsrc.syso
        shell: pwsh
        run: |
          rsrc -manifest app.manifest -ico icon.ico -o rsrc.syso -arch amd64
          Get-ChildItem rsrc.syso | Format-List Length,Name | Out-Host

      - name: Build WhatsApp.exe
        shell: pwsh
        run: |
          go mod download
          go build -trimpath -ldflags="-H windowsgui -s -w" -o WhatsApp.exe .
          Get-ChildItem WhatsApp.exe | Format-List Length,Name | Out-Host
          if (-not (Test-Path WhatsApp.exe)) { throw "Build failed: WhatsApp.exe not found" }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash WhatsApp.exe -Algorithm SHA256 | Format-List | Out-Host
          (Get-FileHash WhatsApp.exe -Algorithm SHA256).Hash + "  WhatsApp.exe" | Out-File -Encoding ascii WhatsApp.exe.sha256
          Get-Content WhatsApp.exe.sha256 | Out-Host

      - name: Generate release notes (delta per versi)
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          $notes = ".github/RELEASE_NOTES_$tag.md"
          # Resolve previous tag for delta range
          $prev = ""
          try { $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null).Trim() } catch {}
          if (-not $prev) {
            # fallback: previous semver tag sorted
            $all = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
            if ($all) { $prev = $all.Trim() }
          }
          $range = if ($prev) { "$prev..$tag" } else { "$tag" }
          $shortHead = git rev-parse --short HEAD
          "# $tag - NODRYX/Whatsapp-Desktop`n`n" | Out-File -Encoding utf8 $notes
          if ($prev) {
            "## Perubahan di $tag (sejak $prev)`n" | Out-File -Append -Encoding utf8 $notes
            "_Range: ``$range`` | HEAD $shortHead_`n`n" | Out-File -Append -Encoding utf8 $notes
          } else {
            "## Perubahan di $tag (rilis awal)`n" | Out-File -Append -Encoding utf8 $notes
            "_HEAD $shortHead_`n`n" | Out-File -Append -Encoding utf8 $notes
          }
          "### Commits`n" | Out-File -Append -Encoding utf8 $notes
          $log = git log --reverse --pretty=format:"- %s (%h) — %ad — %an" --date=short $range 2>&1
          if (-not $log) { $log = "- (tidak ada commits baru di range $range)" }
          $log | Out-File -Append -Encoding utf8 $notes
          "`n`n### Stat`n" | Out-File -Append -Encoding utf8 $notes
          "```````n" | Out-File -Append -Encoding utf8 $notes
          git diff --stat $range 2>$null | Out-File -Append -Encoding utf8 $notes
          "`````` `n" | Out-File -Append -Encoding utf8 $notes
          if ($prev) {
            "`nFull Changelog: https://github.com/NODRYX/Whatsapp-Desktop/compare/$prev...$tag`n" | Out-File -Append -Encoding utf8 $notes
          }
          "`n## Build`n" | Out-File -Append -Encoding utf8 $notes
          "- Go $(go version) | rsrc + go build -ldflags=`"-H windowsgui -s -w`" -trimpath`n" | Out-File -Append -Encoding utf8 $notes
          "- Runner: windows-latest | manifest $(Select-String -Path app.manifest -Pattern 'version=' | ForEach-Object { $_.Line.Trim() })`n" | Out-File -Append -Encoding utf8 $notes
          "---`n_Auto-generated delta ``$range`` untuk $tag._`n" | Out-File -Append -Encoding utf8 $notes
          Get-Content $notes | Out-Host
          "notes_file=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            WhatsApp.exe
            WhatsApp.exe.sha256
            logo.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
